<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Kỳ Môn Độn Giáp – Hà Đồ – TIEN.TQN</title>
  <style>
    /* =========================================
       CSS TỐI ƯU HIỂN THỊ ĐIỆN THOẠI / FOLD / IPAD
       Phong cách Tinh tế, Thanh mảnh, Hiện đại
       ========================================= */
    :root {
      --bg: #f4f6f8;
      --paper: #ffffff;
      --surface: #fafafa;
      --border: #e2e8f0;
      --line: #cbd5e1;
      --text-main: #334155;
      --text-muted: #64748b;
      --accent: #991b1b;
      --accent-hover: #7f1d1d;
      --good: #0f766e;
      --bad: #b42318;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 400; /* Nét chữ thanh mảnh */
      -webkit-font-smoothing: antialiased;
      padding: 8px 4px;
    }

    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 12px auto;
      background: var(--paper);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* Header thanh lịch */
    .page-header {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .page-header .title { font-size: 16px; font-weight: 500; color: var(--accent); letter-spacing: 0.3px; }
    .page-header .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 400; }

    .page-body { padding: 10px; }

    /* Thanh công cụ (Ngày giờ) bo gọn */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      background: var(--surface); padding: 8px 12px;
      border-radius: var(--radius-md); border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .field { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; }
    .field label { font-size: 12px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }
    input[type="datetime-local"] {
      flex: 1; height: 30px; padding: 0 8px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 13px; font-weight: 400; color: var(--text-main);
      outline: none; background: #fff; transition: 0.2s;
    }
    input[type="datetime-local"]:focus { border-color: var(--accent); }
    
    .btn {
      height: 30px; padding: 0 14px; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-weight: 500; font-size: 12px;
      border: none; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.secondary { background: #fff; color: var(--text-main); border: 1px solid var(--line); }
    .btn.secondary:hover { background: #f1f5f9; }

    /* Khối thông tin Dashboard mượt mà */
    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 6px; margin-bottom: 10px; padding: 8px;
      background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border);
    }
    .kv {
      background: var(--surface); padding: 6px; border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    .k { font-size: 9px; color: var(--text-muted); font-weight: 500; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.2px; }
    .v { font-size: 11.5px; font-weight: 500; color: var(--text-main); line-height: 1.3; }

    /* =========================================
       2 BẢNG KỲ MÔN - LUÔN SONG SONG 
       ========================================= */
    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: start;
      width: 100%;
    }
    .board {
      background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border);
      overflow: hidden; display: flex; flex-direction: column; height: 100%;
    }
    .board-head {
      background: #fcfcfc; padding: 7px 0; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .board-head h2 { font-size: 12px; font-weight: 500; color: var(--accent); margin: 0; letter-spacing: 0.2px; }
    
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--line); gap: 1px;
      flex: 1; width: 100%;
    }
    
    .cell { background: #fff; display: flex; flex-direction: column; min-height: 60px; }
    .cell.dim { opacity: 0.5; }
    .cell-shell { padding: 4px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 3px; }
    
    .cell-topline { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
    .meta-chip, .pos {
      font-size: clamp(8px, 1.8vw, 10px);
      font-weight: 400; padding: 2px 4px; border-radius: 3px;
      white-space: nowrap;
    }
    .meta-chip { color: var(--dir-color, #111827); background: rgba(0,0,0,0.03); }
    .pos { color: var(--text-muted); border: 1px solid var(--border); background: #fff; }
    
    .qm-main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; text-align: center; align-items: center; }
    
    /* Chữ thanh mảnh, TỰ ĐỘNG XUỐNG DÒNG (normal) để không bị cắt xén */
    .qm-value, .qm-gate, .stem-line, .pat {
      font-size: clamp(9.5px, 2.2vw, 12.5px);
      font-weight: 500; color: var(--text-main);
      white-space: normal; /* Quan trọng: Cho phép rớt dòng */
      word-break: break-word;
      line-height: 1.25;
    }
    .qm-gate { text-align: center; color: var(--accent); font-weight: 500; margin: 2px 0; }
    .qm-stems { display: flex; flex-direction: column; gap: 2px; }
    
    .pat-wrap { display: flex; flex-direction: column; gap: 3px; }
    .pat.good { color: var(--good); }
    .pat.bad { color: var(--bad); }
    .empty { font-size: 10px; color: var(--text-muted); text-align: center; margin: auto; font-weight: 400; }

    footer { text-align: center; font-size: 11px; color: var(--text-muted); padding: 10px 0; font-weight: 400; }

    /* =========================================
       GIAO DIỆN TRANG 2 - LUẬN QUẺ
       ========================================= */
    .page-2-header { text-align: center; padding: 14px 0 10px 0; border-bottom: 1px dashed var(--border); margin-bottom: 10px; }
    .page-2-header h2 { font-size: 14px; font-weight: 500; color: var(--accent); margin: 0; }
    
    .topic-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; padding: 0 10px 10px 10px; }
    
    .topic-panel, .result-panel {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
      overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
    }
    .topic-panel-head, .result-panel-head, .note-head {
      background: #fdfdfd; padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .topic-panel-head label { font-size: 11px; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 6px; }
    select#topicSelect { width: 100%; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--line); font-weight: 400; color: var(--text-main); font-size: 12.5px; outline: none; background: #fff; }
    
    .topic-guide-box, .result-body { padding: 12px; font-size: 12.5px; line-height: 1.6; color: var(--text-main); min-height: 200px; font-weight: 400; }
    .result-panel-head { display: flex; justify-content: space-between; align-items: center; }
    .result-panel-head span { font-weight: 500; color: var(--good); font-size: 12.5px; }
    
    .note-panel { border-top: 1px solid var(--border); background: #fafafa; }
    .note-head { background: #fdfdfd; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .note-head span { font-size: 11.5px; font-weight: 500; color: var(--text-muted); }
    textarea#analysisNote {
      width: 100%; border: none; background: transparent; padding: 10px 12px;
      font-family: inherit; font-size: 12.5px; color: var(--text-main); outline: none; min-height: 60px; resize: vertical; font-weight: 400;
    }

    /* Đảm bảo điện thoại dọc cực nhỏ không bị tràn */
    @media (max-width: 650px) {
      .boards { gap: 4px; }
      .cell { min-height: 50px; }
      .topic-layout { grid-template-columns: 1fr; } /* Luận quẻ xếp dọc trên phone để dễ đọc */
      .info { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<!-- ========== BẢNG KỲ MÔN ========== -->
<div class="page page-1">
  <div class="page-header">
    <div class="title">Kỳ Môn Độn Giáp – Hà Đồ</div>
    <div class="sub">Cửu cung Hà Đồ (Khôn=ĐN, Tốn=TN, Ly=7, Đoài=9). Hiệu chỉnh bởi TIEN.TQN</div>
  </div>
  <div class="page-body">
    
    <div class="toolbar">
      <div class="field">
        <label>Ngày giờ</label>
        <input id="dt" type="datetime-local" />
      </div>
      <button class="btn" id="btnCalc">Lập bàn</button>
      <button class="btn secondary" id="btnNow">Bây giờ</button>
    </div>

    <!-- Khối Info Dashboard -->
    <div class="info" id="info"></div>

    <!-- Khối Bảng ép song song -->
    <div class="boards">
      <div class="board">
        <div class="board-head"><h2>Bảng Kỳ Môn</h2></div>
        <div class="grid" id="gridQimen"></div>
      </div>
      <div class="board">
        <div class="board-head"><h2>Bảng Cách Cục</h2></div>
        <div class="grid" id="gridPatterns"></div>
      </div>
    </div>
    <footer>Engine by TIEN.TQN</footer>
  </div>
</div>

<!-- ========== BẢNG LUẬN QUẺ ========== -->
<div class="page page-2">
  <div class="page-2-header">
    <h2>Bảng Luận Quẻ Theo Chủ Đề</h2>
  </div>
  <div class="topic-layout">
    
    <!-- Cột trái: Hướng dẫn -->
    <div class="topic-panel">
      <div class="topic-panel-head">
        <label>Chọn chủ đề xem quẻ</label>
        <select id="topicSelect">
          <option value="">-- Chọn chủ đề --</option>
          <option value="1">1. Cơ thể</option><option value="2">2. Nghề nghiệp</option>
          <option value="3">3. Thăng chức</option><option value="4">4. Tìm người dẫn đường</option>
          <option value="5">5. Chuyển việc</option><option value="6">6. Xin việc</option>
          <option value="7">7. Mua hàng</option><option value="8">8. Bán hàng</option>
          <option value="9">9. Mở kinh doanh</option><option value="10">10. Hợp tác</option>
          <option value="11">11. Mua bán BĐS</option><option value="12">12. Đi vay / cho vay</option>
          <option value="13">13. Đòi nợ</option><option value="14">14. Thi đấu</option>
          <option value="15">15. Thi cử</option><option value="16">16. Chỗ đỗ xe</option>
          <option value="17">17. Du lịch</option><option value="18">18. Hôn nhân</option>
          <option value="19">19. Sinh nở (giới tính)</option><option value="20">20. Sinh nở</option>
          <option value="21">21. Sức khỏe</option><option value="22">22. Kiện tụng</option>
          <option value="23">23. Tố tụng hình sự</option><option value="24">24. Đi lạc</option>
          <option value="25">25. Mất đồ</option><option value="26">26. Thời tiết</option>
        </select>
      </div>
      <div id="topicGuide" class="topic-guide-box">
        <div style="color:var(--text-muted);text-align:center;padding:40px 0;">Vui lòng chọn chủ đề để xem hướng dẫn</div>
      </div>
    </div>

    <!-- Cột phải: Kết quả luận quẻ -->
    <div class="result-panel">
      <div class="result-panel-head">
        <span>KẾT QUẢ PHÂN TÍCH</span>
        <button id="btnReAnalyze" class="btn secondary" style="height:24px;font-size:11px;padding:0 10px;">Luận lại</button>
      </div>
      <div id="analysisResult" class="result-body">
        <div style="color:var(--text-muted);text-align:center;padding:40px 0;">Chọn chủ đề để luận quẻ</div>
      </div>
      
      <!-- Box Ghi chú -->
      <div class="note-panel">
        <div class="note-head">
          <span>📝 Ghi chú riêng</span>
          <button id="btnClearNote" style="height:20px;padding:0 8px;font-size:10px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;color:var(--text-muted);border-radius:4px;">Xóa</button>
        </div>
        <textarea id="analysisNote" placeholder="Thêm nhận xét, diễn giải riêng..."></textarea>
      </div>
    </div>

  </div>
</div>

<!-- ==============================================
     THỨ TỰ NHÚNG CÁC SCRIPT (GIỮ NGUYÊN)
     ============================================== -->
<script src="events.js"></script>
<script src="3meta.js"></script>
<script src="logichado.js"></script>
<script src="fixGanZhi.js"></script>
<script src="logicluanque.js"></script>
<script src="main.js"></script>

</body>
</html>
