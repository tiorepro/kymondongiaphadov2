<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Kỳ Môn Độn Giáp – Hà Đồ – TIEN.TQN</title>
  <style>
    /* =========================================
       CSS TỐI ƯU HIỂN THỊ ĐIỆN THOẠI / FOLD / IPAD
       ========================================= */
    :root {
      --bg: #f1f5f9;
      --paper: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --line: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #991b1b;
      --accent-hover: #7f1d1d;
      --good: #0f766e;
      --bad: #b42318;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Font chữ hiện đại, sắc nét cho thiết bị di động */
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      padding: 8px 4px;
    }

    /* Container chính */
    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 12px auto;
      background: var(--paper);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* Header */
    .page-header {
      padding: 12px 16px;
      background: linear-gradient(to right, #fdf8f8, #ffffff);
      border-bottom: 1px solid var(--border);
    }
    .page-header .title { font-size: 15px; font-weight: 700; color: var(--accent); }
    .page-header .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .page-body { padding: 12px; }

    /* Thanh công cụ (Ngày giờ) */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: var(--surface); padding: 8px 12px;
      border-radius: var(--radius-md); border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .field { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 200px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-main); white-space: nowrap; }
    input[type="datetime-local"] {
      flex: 1; height: 32px; padding: 0 8px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 13px; outline: none; transition: 0.2s;
    }
    input[type="datetime-local"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(153,27,27,0.1); }
    
    .btn {
      height: 32px; padding: 0 16px; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-weight: 600; font-size: 12px;
      border: none; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.secondary { background: #fff; color: var(--text-main); border: 1px solid var(--line); }
    .btn.secondary:hover { background: #f1f5f9; }

    /* Khối thông tin (Đã được làm gọn thành dạng Grid Dashboard Card) */
    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 6px; margin-bottom: 12px; padding: 8px;
      background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border);
    }
    .kv {
      background: #fff; padding: 6px 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--line); box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; justify-content: center;
    }
    .k { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; text-transform: uppercase; letter-spacing: -0.2px; }
    .v { font-size: 12px; font-weight: 700; color: var(--text-main); line-height: 1.3; }

    /* =========================================
       2 BẢNG KỲ MÔN - ÉP SONG SONG (SIDE-BY-SIDE)
       ========================================= */
    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr; /* Luôn ép 2 cột */
      gap: 8px;
      align-items: start;
    }
    .board {
      background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border);
      overflow: hidden; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; height: 100%;
    }
    .board-head {
      background: #fdf8f8; padding: 6px 0; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .board-head h2 { font-size: 12px; font-weight: 700; color: var(--accent); margin: 0; }
    
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--line); gap: 1px; /* Tạo viền mỏng bằng gap */
      flex: 1;
    }
    
    /* Thiết kế ô cung (Cell) - Ép chữ co giãn thông minh */
    .cell { background: #fff; display: flex; flex-direction: column; min-height: 68px; }
    .cell.dim { opacity: 0.4; }
    .cell-shell { padding: 3px 4px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    
    .cell-topline { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
    .meta-chip, .pos {
      font-size: clamp(8px, 2vw, 10px); /* Tự nhỏ lại trên đt hẹp */
      font-weight: 700; padding: 1px 4px; border-radius: 4px;
    }
    .meta-chip { background: rgba(0,0,0,0.04); color: var(--dir-color, #111827); }
    .pos { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
    
    .qm-main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; text-align: center; }
    .qm-value, .qm-gate, .stem-line, .pat {
      font-size: clamp(9px, 2.2vw, 12px); /* Scale chữ siêu việt cho Fold/iPad */
      font-weight: 700; color: var(--text-main);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px;
    }
    .qm-gate { text-align: center; color: var(--accent); margin: 2px 0; }
    .qm-stems { display: flex; flex-direction: column; }
    
    /* Box chứa cách cục */
    .pat-wrap { display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
    .pat.good { color: var(--good); }
    .pat.bad { color: var(--bad); }
    .empty { font-size: 10px; color: var(--text-muted); text-align: center; margin: auto; }

    footer { text-align: center; font-size: 10px; color: var(--text-muted); padding: 8px 0; }

    /* =========================================
       GIAO DIỆN TRANG 2 - LUẬN QUẺ
       ========================================= */
    .page-2-header { text-align: center; padding: 16px 0 12px 0; border-bottom: 1px dashed var(--border); margin-bottom: 12px; }
    .page-2-header h2 { font-size: 15px; font-weight: 700; color: var(--accent); margin: 0; }
    
    .topic-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; padding: 0 12px 12px 12px; }
    
    .topic-panel, .result-panel {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column;
    }
    .topic-panel-head, .result-panel-head, .note-head {
      background: var(--surface); padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    .topic-panel-head label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px; }
    select#topicSelect { height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--line); font-weight: 600; color: var(--accent); }
    
    .topic-guide-box, .result-body { padding: 12px; font-size: 13px; line-height: 1.6; color: var(--text-main); min-height: 220px; }
    .result-panel-head { display: flex; justify-content: space-between; align-items: center; }
    .result-panel-head span { font-weight: 700; color: var(--good); font-size: 13px; }
    
    .note-panel { border-top: 1px solid var(--border); background: #fffdf0; }
    .note-head { background: #fefce8; border-bottom: 1px solid #fef08a; display: flex; justify-content: space-between; align-items: center; }
    .note-head span { font-size: 11px; font-weight: 700; color: #92400e; }
    textarea#analysisNote {
      width: 100%; border: none; background: transparent; padding: 10px 12px;
      font-family: inherit; font-size: 13px; color: var(--text-main); outline: none; min-height: 80px; resize: vertical;
    }

    /* Đảm bảo điện thoại dọc cực nhỏ không bị tràn */
    @media (max-width: 480px) {
      .boards { gap: 4px; }
      .cell { min-height: 56px; }
      .topic-layout { grid-template-columns: 1fr; } /* Luận quẻ xếp dọc trên phone */
      .qm-value, .qm-gate, .stem-line, .pat { font-size: 9.5px; letter-spacing: -0.5px; }
      .info { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<!-- ========== BẢNG KỲ MÔN ========== -->
<div class="page page-1">
  <div class="page-header">
    <div class="title">Kỳ Môn Độn Giáp – Hà Đồ</div>
    <div class="sub">Cửu cung Hà Đồ (Khôn=ĐN, Tốn=TN, Ly=7, Đoài=9). Hiệu chỉnh bởi TIEN.TQN</div>
  </div>
  <div class="page-body">
    
    <div class="toolbar">
      <div class="field">
        <label>Ngày giờ</label>
        <input id="dt" type="datetime-local" />
      </div>
      <button class="btn" id="btnCalc">Lập bàn</button>
      <button class="btn secondary" id="btnNow">Bây giờ</button>
    </div>

    <!-- Khối Info Dashboard -->
    <div class="info" id="info"></div>

    <!-- Khối Bảng ép song song -->
    <div class="boards">
      <div class="board">
        <div class="board-head"><h2>Bảng Kỳ Môn</h2></div>
        <div class="grid" id="gridQimen"></div>
      </div>
      <div class="board">
        <div class="board-head"><h2>Bảng Cách Cục</h2></div>
        <div class="grid" id="gridPatterns"></div>
      </div>
    </div>
    <footer>Kỳ Môn Độn Giáp by TIEN.TQN</footer>
  </div>
</div>

<!-- ========== BẢNG LUẬN QUẺ ========== -->
<div class="page page-2">
  <div class="page-2-header">
    <h2>Bảng Luận Quẻ Theo Chủ Đề</h2>
  </div>
  <div class="topic-layout">
    
    <!-- Cột trái: Hướng dẫn -->
    <div class="topic-panel">
      <div class="topic-panel-head">
        <label>Chọn chủ đề xem quẻ</label>
        <select id="topicSelect">
          <option value="">-- Chọn chủ đề --</option>
          <option value="1">1. Cơ thể</option><option value="2">2. Nghề nghiệp</option>
          <option value="3">3. Thăng chức</option><option value="4">4. Tìm người dẫn đường</option>
          <option value="5">5. Chuyển việc</option><option value="6">6. Xin việc</option>
          <option value="7">7. Mua hàng</option><option value="8">8. Bán hàng</option>
          <option value="9">9. Mở kinh doanh</option><option value="10">10. Hợp tác</option>
          <option value="11">11. Mua bán BĐS</option><option value="12">12. Đi vay / cho vay</option>
          <option value="13">13. Đòi nợ</option><option value="14">14. Thi đấu</option>
          <option value="15">15. Thi cử</option><option value="16">16. Chỗ đỗ xe</option>
          <option value="17">17. Du lịch</option><option value="18">18. Hôn nhân</option>
          <option value="19">19. Sinh nở (giới tính)</option><option value="20">20. Sinh nở</option>
          <option value="21">21. Sức khỏe</option><option value="22">22. Kiện tụng</option>
          <option value="23">23. Tố tụng hình sự</option><option value="24">24. Đi lạc</option>
          <option value="25">25. Mất đồ</option><option value="26">26. Thời tiết</option>
        </select>
      </div>
      <div id="topicGuide" class="topic-guide-box">
        <div style="color:var(--text-muted);text-align:center;padding:40px 0;">Vui lòng chọn chủ đề để xem hướng dẫn</div>
      </div>
    </div>

    <!-- Cột phải: Kết quả luận quẻ -->
    <div class="result-panel">
      <div class="result-panel-head">
        <span>KẾT QUẢ PHÂN TÍCH</span>
        <button id="btnReAnalyze" class="btn secondary" style="height:24px;font-size:11px;padding:0 10px;">Luận lại</button>
      </div>
      <div id="analysisResult" class="result-body">
        <div style="color:var(--text-muted);text-align:center;padding:40px 0;">Chọn chủ đề để luận quẻ</div>
      </div>
      
      <!-- Box Ghi chú -->
      <div class="note-panel">
        <div class="note-head">
          <span>📝 Ghi chú bổ sung bởi Khầy Tiến</span>
          <button id="btnClearNote" style="height:20px;padding:0 8px;font-size:10px;border:1px solid #fef08a;background:#fff;cursor:pointer;color:#92400e;border-radius:4px;">Xoá</button>
        </div>
        <textarea id="analysisNote" placeholder="Thêm nhận xét, diễn giải riêng..."></textarea>
      </div>
    </div>

  </div>
</div>

<!-- ==============================================
     THỨ TỰ NHÚNG CÁC SCRIPT (KHÔNG THAY ĐỔI)
     ============================================== -->
<script src="events.js"></script>
<script src="3meta.js"></script>
<script src="logichado.js"></script>
<script src="fixGanZhi.js"></script>
<script src="logicluanque.js"></script>
<script src="main.js"></script>

</body>
</html>
